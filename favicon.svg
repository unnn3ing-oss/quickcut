<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- QuickCut 圖示：場記板（米色底、深色板身、白斜紋、藍色標籤）。頁首標題旁的 icon 也直接用這個檔案（index.html 的 .brand-ic） -->
  <defs>
    <clipPath id="qcLogoBar"><rect x="9" y="23.5" width="46" height="7.5" rx="1.5"/></clipPath>
    <clipPath id="qcLogoArm"><rect x="9" y="15" width="46" height="7.5" rx="1.5"/></clipPath>
    <path id="qcLogoStripes" d="M1 0h6l-4 7.5h-6zM13 0h6l-4 7.5h-6zM25 0h6l-4 7.5h-6zM37 0h6l-4 7.5h-6zM49 0h6l-4 7.5h-6zM61 0h6l-4 7.5h-6z" fill="#fff"/>
  </defs>
  <rect width="64" height="64" rx="14" fill="#f6f0e4"/>
  <!-- 板身 -->
  <rect x="9" y="31" width="46" height="24" rx="4" fill="#1f2a3d"/>
  <rect x="15" y="36.5" width="34" height="3.2" rx="1.6" fill="#fff" opacity=".92"/>
  <rect x="15" y="44.5" width="18" height="3.2" rx="1.6" fill="#fff" opacity=".6"/>
  <rect x="38" y="43" width="11" height="7" rx="2" fill="#004aad"/>
  <!-- 下橫條 -->
  <g clip-path="url(#qcLogoBar)">
    <rect x="9" y="23.5" width="46" height="7.5" fill="#1f2a3d"/>
    <use href="#qcLogoStripes" y="23.5"/>
  </g>
  <!-- 上拍板：以左邊鉸鏈往上張開 12° -->
  <g transform="rotate(-12 10 23)">
    <g clip-path="url(#qcLogoArm)">
      <rect x="9" y="15" width="46" height="7.5" fill="#1f2a3d"/>
      <use href="#qcLogoStripes" y="15"/>
    </g>
  </g>
</svg>
